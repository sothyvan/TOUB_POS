name: Daily Database Backup

on:
  # Run automatically every day at 11:00 PM Phnom Penh time (UTC+7 = 16:00 UTC)
  schedule:
    - cron: "0 16 * * *"

  # Also allow triggering manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository so backup_database.py is available
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install the MySQL client (provides mysqldump)
      - name: Install MySQL client
        run: sudo apt-get install -y mysql-client

      # 3. Write the .env file from GitHub Secrets so the script can read it
      #    Never commit real credentials — this keeps them out of your repo.
      - name: Create backend/.env from secrets
        run: |
          cat > backend/.env <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          EOF

      # 4. Run your existing Python backup script
      - name: Run backup script
        run: python3 backup_database.py

      # 5. Upload the .sql file as a GitHub Actions artifact
      #    It will be kept for 30 days and downloadable from the Actions tab.
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.sql
          retention-days: 30
